<!DOCTYPE html>
<html>
<head>
    <title>Mini LMS - Course Details</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .course-detail-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .course-detail-header h1 {
            margin: 0 0 15px 0;
            font-size: 2.5em;
        }
        
        .course-detail-header p {
            margin: 0;
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .course-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .meta-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .meta-card h3 {
            margin: 0 0 10px 0;
            color: #667eea;
            font-size: 0.9em;
            text-transform: uppercase;
        }
        
        .meta-card p {
            margin: 0;
            color: #333;
            font-size: 1.1em;
        }
        
        .course-content {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        
        .course-content h2 {
            color: #333;
            margin-top: 0;
        }
        
        .course-content p {
            color: #666;
            line-height: 1.8;
        }
        
        .lessons-section {
            margin-bottom: 30px;
        }
        
        .lessons-section h2 {
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .lesson-item {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #667eea;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .lesson-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        
        .lesson-item h3 {
            margin: 0 0 5px 0;
            color: #667eea;
        }
        
        .lesson-item p {
            margin: 0;
            color: #666;
            font-size: 0.9em;
        }
        
        .no-content {
            text-align: center;
            padding: 40px;
            color: #999;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .back-btn, .enroll-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1em;
            transition: all 0.3s ease;
        }
        
        .back-btn {
            background: #e0e0e0;
            color: #333;
        }
        
        .back-btn:hover {
            background: #d0d0d0;
            transform: scale(1.02);
        }
        
        .enroll-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .enroll-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #c33;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="button-group">
            <button class="back-btn" onclick="goBack()">← Back to Courses</button>
            <button class="enroll-btn" onclick="enrollCourse()">Enroll Now</button>
        </div>
        
        <div id="courseContent">
            <div class="loading">Loading course details...</div>
        </div>
    </div>

<script>
async function loadCourseDetail() {
    const token = localStorage.getItem("token");
    if (!token) {
        alert("Please login first");
        window.location.href = "/";
        return;
    }
    
    // Get course ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const courseId = urlParams.get('id');
    
    if (!courseId) {
        document.getElementById("courseContent").innerHTML = 
            '<div class="error">Course ID not found</div>';
        return;
    }
    
    try {
        // Fetch all courses and find the one we need
        const response = await fetch("http://127.0.0.1:8000/api/courses/", {
            headers: {
                "Authorization": "Bearer " + token
            }
        });
        
        if (!response.ok) throw new Error('Failed to load courses');
        
        const courses = await response.json();
        const course = courses.find(c => c.id == courseId);
        
        if (!course) {
            document.getElementById("courseContent").innerHTML = 
                '<div class="error">Course not found</div>';
            return;
        }
        
        // Render course detail
        const content = `
            <div class="course-detail-header">
                <h1>${course.title}</h1>
                <p>${course.description}</p>
            </div>
            
            <div class="course-meta">
                <div class="meta-card">
                    <h3>Course ID</h3>
                    <p>${course.id}</p>
                </div>
                <div class="meta-card">
                    <h3>Instructor ID</h3>
                    <p>${course.instructor}</p>
                </div>
                <div class="meta-card">
                    <h3>Status</h3>
                    <p>Available</p>
                </div>
            </div>
            
            <div class="course-content">
                <h2>About this Course</h2>
                <p>${course.description}</p>
                <p>This comprehensive course covers all the essential topics you need to master ${course.title.toLowerCase()}. Through a combination of video lectures, hands-on exercises, and real-world projects, you'll gain practical skills that you can apply immediately.</p>
            </div>
            
            <div class="lessons-section">
                <h2>📚 Course Content</h2>
                <div class="lesson-item">
                    <h3>Module 1: Fundamentals</h3>
                    <p>Introduction and core concepts</p>
                </div>
                <div class="lesson-item">
                    <h3>Module 2: Intermediate Topics</h3>
                    <p>Building on the basics with more advanced concepts</p>
                </div>
                <div class="lesson-item">
                    <h3>Module 3: Advanced Techniques</h3>
                    <p>Expert-level strategies and best practices</p>
                </div>
                <div class="lesson-item">
                    <h3>Module 4: Capstone Project</h3>
                    <p>Put your skills to work on a real project</p>
                </div>
            </div>
        `;
        
        document.getElementById("courseContent").innerHTML = content;
    } catch(err) {
        console.error("Error loading course:", err);
        document.getElementById("courseContent").innerHTML = 
            '<div class="error">Error loading course details: ' + err.message + '</div>';
    }
}

function goBack() {
    window.location.href = "/courses/";
}

function enrollCourse() {
    alert("Thank you! You have successfully enrolled in this course.");
    goBack();
}

loadCourseDetail();
</script>
</body>
</html>
